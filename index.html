<header class="header"><div class="header-inner"><div class="brand"><div class="brand-icon" id="brand-icon"></div><div><div class="eyebrow">IL QUADERNO DELLA FAMIGLIA</div><h1>Bilancio di casa</h1><p class="brand-subtitle">Un po’ di ordine, più serenità.</p></div></div><div class="header-right"><span class="private" id="privacy"></span><button class="btn" data-action="backup" title="Esporta backup JSON" id="header-backup"></button></div></div></header>

<script id="budget-core">
(function(root){
'use strict';
const categories=['Mutuo','Finanziaria "Compass"','Finanziaria "Younited"','Acqua','Luce','Gas','Spazzatura (TARI)','Abbonamento Internet','Sorveglianza Casa','Ricarica telefono','Utenze Varie','Assicurazioni','Spesa alimentare','Carburante','Altro'];
const pad=n=>String(n).padStart(2,'0');
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
function dateStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function localDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function keyDate(k){const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1,12)}
function addKey(k,n){const d=keyDate(k);d.setMonth(d.getMonth()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function periodKey(date,startDay){const d=new Date(date.getFullYear(),date.getMonth(),1,12);if(startDay>1 && date.getDate()>=startDay)d.setMonth(d.getMonth()+1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function bounds(key,startDay){const d=keyDate(key);if(startDay===1)return {start:new Date(d.getFullYear(),d.getMonth(),1,12),end:new Date(d.getFullYear(),d.getMonth()+1,0,12)};return {start:new Date(d.getFullYear(),d.getMonth()-1,startDay,12),end:new Date(d.getFullYear(),d.getMonth(),startDay-1,12)}}
function movementDate(key,day,startDay){const d=keyDate(startDay>1&&day>=startDay?addKey(key,-1):key);return dateStr(new Date(d.getFullYear(),d.getMonth(),Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()),12))}
function distance(a,b){const x=keyDate(a),y=keyDate(b);return (y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth()}
function defaults(now=new Date()){return {version:1,settings:{startDay:23,firstPeriod:periodKey(now,23),initialBalance:0},incomes:[],expenses:[],extras:[],customCategories:[],overrides:{},checks:{}}}
function rows(state,key,today=new Date()){
 if(key<state.settings.firstPeriod)return [];
 const td=dateStr(today),out=[],s=state.settings.startDay;
 function fixed(item,type){const id=type+':'+item.id+':'+key,date=movementDate(key,item.day,s),edited=Object.prototype.hasOwnProperty.call(state.overrides,id);out.push({id,sourceId:item.id,type,category:item.category,note:item.note||'',date,base:item.amount,amount:edited?state.overrides[id]:item.amount,edited,fixed:true,auto:type==='income'&&date<=td,paid:type==='income'?(date<=td||state.checks[id]===true):state.checks[id]===true})}
 state.incomes.forEach(i=>fixed(i,'income'));
 state.expenses.filter(e=>e.active!==false&&(e.frequency===1||(distance(e.anchor,key)>=0&&distance(e.anchor,key)%e.frequency===0))).forEach(e=>fixed(e,'expense'));
 state.extras.filter(e=>periodKey(localDate(e.date),s)===key).forEach(e=>{const id='extra:'+e.id,edited=Object.prototype.hasOwnProperty.call(state.overrides,id);out.push({...e,id,sourceId:e.id,base:e.amount,amount:edited?state.overrides[id]:e.amount,edited,fixed:false,auto:e.type==='income'&&e.date<=td,paid:e.type==='income'?(e.date<=td||state.checks[id]===true):state.checks[id]===true})});
 return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.type==='income'?-1:1)||a.id.localeCompare(b.id));
}
function totals(list){return {income:round(list.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0)),expense:round(list.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0)),current:round(list.filter(r=>r.paid).reduce((s,r)=>s+(r.type==='income'?r.amount:-r.amount),0))}}
function opening(state,key,today=new Date()){let amount=state.settings.initialBalance;if(key<state.settings.firstPeriod)return amount;for(let k=state.settings.firstPeriod;k<key;k=addKey(k,1)){const t=totals(rows(state,k,today));amount=round(amount+t.income-t.expense)}return amount}
function balance(state,key,today=new Date()){const list=rows(state,key,today),t=totals(list),start=opening(state,key,today);return {...t,start,forecast:round(start+t.income-t.expense),current:round(start+t.current),rows:list}}
function monthly(state){const income=round(state.incomes.reduce((s,r)=>s+r.amount,0)),expense=round(state.expenses.filter(e=>e.active!==false).reduce((s,r)=>s+r.amount/r.frequency,0));return {income,expense,margin:round(income-expense)}}
function validate(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw)||raw.version!==1)throw Error('Questo file non è un backup compatibile del quaderno.');
 const s=raw.settings,month=/^\d{4}-(0[1-9]|1[0-2])$/,date=/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
 const amount=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=999999999;
 if(!s||!Number.isInteger(s.startDay)||s.startDay<1||s.startDay>28||!month.test(s.firstPeriod)||Number(s.firstPeriod.slice(0,4))<1900||Number(s.firstPeriod.slice(0,4))>2100||!Number.isFinite(s.initialBalance)||Math.abs(s.initialBalance)>999999999)throw Error('Le impostazioni nel backup non sono valide.');
 if(!['incomes','expenses','extras','customCategories'].every(k=>Array.isArray(raw[k])&&raw[k].length<=5000)||!raw.overrides||!raw.checks||typeof raw.overrides!=='object'||typeof raw.checks!=='object'||Array.isArray(raw.overrides)||Array.isArray(raw.checks))throw Error('Il backup è incompleto.');
 const name=x=>typeof x==='string'&&x.trim().length>0&&x.length<=120;
 const ids=new Set();const basic=e=>{if(!e||!name(e.id)||!name(e.category)||!amount(e.amount)||typeof(e.note||'')!=='string'||(e.note||'').length>500||ids.has(e.id))throw Error('Un movimento nel backup non è valido.');ids.add(e.id)};
 raw.incomes.forEach(e=>{basic(e);if(!['Stipendio','Pensione','Altro'].includes(e.category)||!Number.isInteger(e.day)||e.day<1||e.day>31)throw Error('Entrata non valida.');});
 raw.expenses.forEach(e=>{basic(e);if(!Number.isInteger(e.day)||e.day<1||e.day>31||![1,2,3,12].includes(e.frequency)||typeof e.active!=='boolean'||!month.test(e.anchor))throw Error('Uscita non valida.');});
 raw.extras.forEach(e=>{basic(e);if(!['income','expense'].includes(e.type)||!date.test(e.date)||dateStr(localDate(e.date))!==e.date)throw Error('Data del movimento non valida.');});
 if(!raw.customCategories.every(name)||new Set(raw.customCategories).size!==raw.customCategories.length)throw Error('Voci personalizzate non valide.');
 if(!Object.values(raw.overrides).every(amount)||!Object.values(raw.checks).every(x=>typeof x==='boolean'))throw Error('Importi o spunte non validi.');
 const clean=JSON.parse(JSON.stringify(raw));clean.settings={startDay:s.startDay,firstPeriod:s.firstPeriod,initialBalance:round(s.initialBalance)};clean.incomes=raw.incomes.map(e=>({id:e.id,category:e.category,amount:round(e.amount),day:e.day,note:e.note||''}));clean.expenses=raw.expenses.map(e=>({id:e.id,category:e.category,amount:round(e.amount),day:e.day,frequency:e.frequency,active:e.active,anchor:e.anchor}));clean.extras=raw.extras.map(e=>({id:e.id,type:e.type,category:e.category,amount:round(e.amount),date:e.date,note:e.note||''}));clean.customCategories=[...raw.customCategories];clean.overrides=Object.fromEntries(Object.entries(raw.overrides).map(([k,v])=>[k,round(v)]));clean.checks=Object.fromEntries(Object.entries(raw.checks));return clean;
}
root.BilancioCore={categories,round,dateStr,localDate,keyDate,addKey,periodKey,bounds,movementDate,distance,defaults,rows,totals,opening,balance,monthly,validate};
})(globalThis);
</script>

const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',book:'<path d="M4 3h14a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2z"/><path d="M4 17h16M8 3v14m4-10h4m-4 4h4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-13 4h2m4 0h2"/>',down:'<path d="m6 9 6 6 6-6"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',income:'<path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/>',expense:'<path d="M12 15V3m-5 5 5-5 5 5M4 15v5h16v-5"/>',wallet:'<path d="M3 7V5a2 2 0 0 1 2-2h13v4"/><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M21 12h-7v5h7m-4-2h.01"/>',chart:'<path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5a9 9 0 0 1 5.5 5.5H15z"/>',stats:'<path d="M4 20V10m8 10V4m8 16v-7M2 21h20"/>',settings:'<path d="m9 3-.5 3-2 1-2.7-1-2 3 2.2 2v2L2 15l2 3 2.7-1 2 1 .5 3h6l.5-3 2-1 2.7 1 2-3-2.2-2v-2L22 9l-2-3-2.7 1-2-1-.5-3z"/><circle cx="12" cy="12" r="3"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 4v3"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6zM13 6l5 5"/>',bulb:'<path d="M9 18h6m-5 3h4M9 15c0-2-4-3-4-7a7 7 0 0 1 14 0c0 4-4 5-4 7z"/>',flame:'<path d="M12 2c1 6 7 5 7 12a7 7 0 0 1-14 0c0-3 2-6 4-8 0 4 2 4 3 5 2-3 1-5 0-9z"/>',drop:'<path d="M12 2S5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z"/><path d="M8 15a4 4 0 0 0 4 4"/>',wifi:'<path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-11 4a6 6 0 0 1 8 0"/><circle cx="12" cy="20" r="1"/>',camera:'<rect x="3" y="5" width="12" height="14" rx="2"/><path d="m15 10 6-4v12l-6-4"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4M10 5h4"/>',shield:'<path d="m12 2 8 3v7c0 5-8 10-8 const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.tag}</svg>`;
const categoryIcon=n=>({'Mutuo':'home','Luce':'bulb','Gas':'flame','Acqua':'drop','Spazzatura (TARI)':'trash','Abbonamento Internet':'wifi','Sorveglianza Casa':'camera','Ricarica telefono':'phone','Assicurazioni':'shield','Spesa alimentare':'cart','Carburante':'fuel','Stipendio':'briefcase','Pensione':'pension','Finanziaria "Compass"':'compass','Finanziaria "Younited"':'younited','Utenze Varie':'bulb'}[n]||'tag');

let state=C.defaults(),storageFailure='',loadFailure='',page='home',selected=C.periodKey(new Date(),23),openIncome=false,openExpense=false,modalData=null,confirmCallback=null,toastTimer;

function periodBar(){const b=C.bounds(selected,state.settings.startDay),current=C.periodKey(new Date(),state.settings.startDay);return `<div class="period-bar"><div class="period-title"><div class="period-marker">${icon('calendar')}</div><div><div class="period-caption">IL TUO MESE DI BILANCIO</div><h2 class="period-name">${esc(namePeriod(selected))} <span class="muted">${C.keyDate(selected).getFullYear()}</span></h2><div class="period-date">${fmtDate(C.dateStr(b.start))} – ${fmtDate(C.dateStr(b.end))}</div></div></div><div class="period-controls"><button class="btn icon-only" data-action="previous" aria-label="Periodo precedente" title="Periodo precedente">${icon('left')}</button><button class="btn small" data-action="today"${selected===current?' aria-current="date"':''}>Oggi</button><button class="btn icon-only" data-action="next" aria-label="Periodo successivo" title="Periodo successivo">${icon('right')}</button></div></div>`}

function donut(list){const data=categoryTotals(list),total=C.round(data.reduce((s,r)=>s+r[1],0));let offset=0;const circles=data.map((r,i)=>{const length=total?r[1]/total*502.655:0,html=`<circle class="chart-c${i%6}" cx="100" cy="100" r="80" stroke-dasharray="${length} ${502.655-length}" stroke-dashoffset="${-offset}"><title>${esc(r[0])}: ${money(r[1])}</title></circle>`;offset+=length;return html}).join('');return `<div class="chart-area"><div class="donut" role="img" aria-label="Uscite per categoria, totale ${money(total)}"><svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="80"/>${circles}</svg><div class="donut-center">${total?'':icon('leaf')}<strong class="money">${money(total)}</strong><span>uscite del periodo</span></div></div>${data.length?`<div class="legend">${data.map((r,i)=>`<div class="legend-row"><span class="dot chart-c${i%6}"></span>${icon(categoryIcon(r[0]))}<span class="legend-name">${esc(r[0])}</span><strong>${Math.round(r[1]/total*100)||0}%</strong></div>`).join('')}</div>`:'<div class="empty-legend"><h3>Ogni spesa,<br>al suo posto.</h3><p>Le uscite del mese compariranno qui, divise per voce.</p></div>'}</div>`}
function home(){const b=C.balance(state,selected),hasExpenses=b.rows.some(r=>r.type==='expense');return `${periodBar()}<div class="summary-grid">${summary('Entrate',b.income,'Totale del periodo','income','income')}${summary('Uscite',b.expense,'Totale del periodo','expense','expense')}${summary('Saldo previsto',b.forecast,'A fine periodo','featured','chart')}${summary('Saldo attuale',b.current,'Disponibile oggi','','wallet')}</div><div class="home-grid"><section class="panel"><div class="panel-heading"><h3>Dove vanno le uscite</h3><span class="muted">PER CATEGORIA</span></div>${donut(b.rows)}${!hasExpenses?`<div class="shortcuts"><div class="shortcuts-label">LE SPESE DI CASA</div><div class="shortcut-grid">${['Mutuo','Luce','Gas'].map(n=>`<button class="btn shortcut" data-action="add-expense" data-category="${n}">${icon(categoryIcon(n))}${n}</button>`).join('')}</div></div>`:''}</section><div class="due-stack">${disclosure(b.rows.filter(r=>r.type==='income'),'income')}${disclosure(b.rows.filter(r=>r.type==='expense'),'expense')}</div></div>${footer()}`}
function movements(){const b=C.balance(state,selected);let running=b.start,day='';return `${periodBar()}<div class="section-top"><div><h2>Movimenti</h2><p>Il filo dei conti, giorno per giorno.</p></div><button class="btn primary" data-action="extra">${icon('plus')} Aggiungi</button></div><section class="panel"><div class="balance-strip"><span>Saldo di inizio periodo</span><strong class="money ${b.start<0?'negative':''}">${money(b.start)}</strong></div>${b.rows.length?`<div class="list-heading"><span>${b.rows.length} movimenti</span><span>Importo · Saldo progressivo</span></div><div class="movement-list">${b.rows.map(r=>{running=C.round(running+(r.type==='income'?r.amount:-r.amount));const newDay=day!==r.date;day=r.date;return `${newDay?`<div class="day-heading">${C.localDate(r.date).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</div>`:''}<div class="row"><div class="row-icon ${r.type==='income'?'in':''}">${icon(categoryIcon(r.category))}</div><div class="row-info"><button class="movement-name" data-action="real" data-id="${esc(r.id)}"><div class="row-name">${esc(r.category)}</div><div class="row-sub">${r.fixed?'Ricorrente':'Una tantum'}${r.note?' · '+esc(r.note):''}${r.edited?' · importo reale':''}</div></button></div><div class="row-amount"><span class="money ${r.type==='income'?'income':'expense'}">${r.type==='income'?'+':'−'}${money(r.amount)}</span><small class="money ${running<0?'negative':''}">${money(running)}</small></div>${check(r)}</div>`}).join('')}</div>`:empty('Un nuovo mese, una pagina bianca.','Aggiungi le entrate e le spese di questo periodo.','extra','Primo movimento') }</section><div class="list-footer">${icon('calendar')} Progressivo previsto: comprende tutti i movimenti del periodo.</div>${footer()}`}
function recurring(type){const inc=type==='income',list=inc?state.incomes:state.expenses,sorted=[...list].sort((a,b)=>a.day-b.day),m=C.monthly(state);return `${periodBar()}<div class="section-top"><div><h2>${inc?'Entrate':'Uscite'} ricorrenti</h2><p>${inc?'Le certezze da cui comincia il mese.':'Gli impegni di casa, tutti in ordine.'}</p></div><button class="btn primary" data-action="add-${type}">${icon('plus')} Aggiungi</button></div>${!inc?`<div class="recurring-summary">${summary('Entrate fisse',m.income,'Ogni mese','income','income')}${summary('Uscite fisse',m.expense,'Media mensile','expense','expense')}${summary('Margine mensile',m.margin,'Prima delle spese extra','','wallet')}</div>`:''}<section class="panel">${sorted.length?`<div class="list-heading"><span>${sorted.length} ${inc?'entrate':'uscite'} inserite</span><span>Ordinate per giorno</span></div><div class="movement-list">${sorted.map(e=>`<div class="row"><div class="row-icon ${inc?'in':''}">${icon(categoryIcon(e.category))}</div><div class="row-info"><div class="row-name">${esc(e.category)} ${!inc&&e.active===false?'<span class="badge suspended">Sospesa</span>':''}</div><div class="row-sub">Giorno ${e.day} · ${inc?'Ogni mese':frequencies[e.frequency]}${inc&&e.note?' · '+esc(e.note):''}</div></div><div class="row-amount money ${inc?'income':'expense'}">${money(e.amount)}</div><button class="btn quiet icon-only" data-action="edit-${type}" data-id="${esc(e.id)}" aria-label="Modifica ${esc(e.category)}" title="Modifica">${icon('edit')}</button><button class="btn quiet icon-only" data-action="delete-${type}" data-id="${esc(e.id)}" aria-label="Elimina ${esc(e.category)}" title="Elimina">${icon('trash')}</button></div>`).join('')}</div>`:empty(inc?'Da qui inizia il tuo bilancio.':'Facciamo ordine nelle spese.',inc?'Stipendio, pensione o altre entrate: basta inserirle una volta.':'Inserisci gli impegni ricorrenti della tua famiglia.',`add-${type}`,inc?'Aggiungi un’entrata':'Aggiungi un’uscita',inc?'income':'hom function statistics(){const periods=Array.from({length:6},(_,i)=>C.addKey(selected,i-5)),data=periods.map(k=>({key:k,...C.balance(state,k)})),list=data.flatMap(d=>d.rows),t=C.totals(list),max=Math.max(1,...data.flatMap(d=>[d.income,d.expense]));return `${periodBar()}<div class="section-top"><div><h2>Uno sguardo d’insieme</h2><p>Il bilancio degli ultimi sei periodi.</p></div></div><div class="recurring-summary">${summary('Entrate · 6 periodi',t.income,'Totale complessivo','income','income')}${summary('Uscite · 6 periodi',t.expense,'Totale complessivo','expense','expense')}${summary('Bilancio · 6 periodi',C.round(t.income-t.expense),'Entrate meno uscite','','chart')}</div><div class="stats-grid"><section class="panel"><div class="panel-heading"><h3>Entrate e uscite</h3><span class="muted">6 PERIODI</span></div><div class="stat-chart"><div class="bars">${data.map(d=>`<div class="bar-group"><div class="bar-pair"><svg viewBox="0 0 55 145" role="img" aria-label="${namePeriod(d.key)}: entrate ${money(d.income)}, uscite ${money(d.expense)}"><rect class="bar-income" x="6" y="${145-d.income/max*138}" width="18" height="${d.income/max*138}" rx="3"/><rect class="bar-expense" x="30" y="${145-d.expense/max*138}" width="18" height="${d.expense/max*138}" rx="3"/></svg></div><small>${namePeriod(d.key).slice(0,3)} ${d.key.slice(2,4)}</small></div>`).join('')}</div><div class="chart-key"><span><i class="dot key-in"></i> Entrate</span><span><i class="dot key-out"></i> Uscite</span></div></div></section><section class="panel"><div class="panel-heading"><h3>Uscite per categoria</h3></div>${donut(list)}</section></div><section class="panel stats-lower"><div class="panel-heading"><h3>Il bilancio dei periodi</h3></div><div class="table-wrap"><table class="stats-table"><thead><tr><th>Periodo</th><th>Entrate</th><th>Uscite</th><th>Bilancio</th><th>Saldo finale</th></tr></thead><tbody>${data.map(d=>`<tr><td class="period-name">${namePeriod(d.key)} ${d.key.slice(0,4)}</td><td class="money income">${money(d.income)}</td><td class="money expense">${money(d.expense)}</td><td class="money ${d.income-d.expense<0?'negative':'income'}">${money(C.round(d.income-d.expense))}</td><td class="money ${d.forecast<0?'negative':''}">${money(d.forecast)}</td></tr>`).join('')}</tbody></table></div></section>${categoryTotals(list).length?`<section class="panel stats-lower"><div class="panel-heading"><h3>Totali per voce</h3></div><div class="movement-list">${categoryTotals(list).map(r=>`<div class="row"><div class="row-icon">${icon(categoryIcon(r[0]))}</div><div class="row-info row-name">${esc(r[0])}</div><strong class="money expense">${money(r[1])}</strong></div>`).join('')}</div></section>`:''}${footer()}`}
function settings(){return `<div class="section-top"><div><h2>Impostazioni</h2><p>Il quaderno, a modo tuo.</p></div></div><div class="settings-grid"><div><section class="panel settings-section"><div class="settings-body"><h3>Configurazione</h3>${['income','expense'].map(t=>`<div class="settings-row"><div class="row-icon ${t==='income'?'in':''}">${icon(t)}</div><div class="row-info"><strong>${t==='income'?'Entrate':'Uscite'} inserite</strong><div class="row-sub">${state[t==='income'?'incomes':'expenses'].length} ${t==='income'?'entrate':'uscite'} ricorrenti</div></div><button class="btn icon-only" data-action="go-${t==='income'?'incomes':'expenses'}" aria-label="Apri ${t==='income'?'Entrate':'Uscite'}">${icon('right')}</button></div>`).join('')}</div></section><section class="panel settings-section"><div class="settings-body"><h3>Il mese di bilancio</h3><form id="settings-form"><div class="field"><label for="start-day">Giorno di inizio</label><select id="start-day" name="startDay">${Array.from({length:28},(_,i)=>`<option value="${i+1}"${state.settings.startDay===i+1?' selected':''}>${i+1}${i===0?' · Mese di calendario':''}</option>`).join('')}</select><small>Il periodo prende il nome del mese in cui termina.</small></div><div class="field"><label for="first-period">Primo periodo</label><input type="month" id="first-period" name="firstPeriod" value="${esc(state.settings.firstPeriod)}" min="1900-01" max="2100-12" required></div><div class="field"><label for="initial-balance">Saldo iniziale</label><input id="initial-balance" name="initialBalance" inputmode="decimal" value="${amountValue(state.settings.initialBalance)}" required><small>Facoltativo. Lascia 0 se non serve.</small></div><button class="btn primary" type="submit">${icon('check')} Salva impostazioni</button><div class="form-error" id="settings-error" role="status"></div></form></div></section><section class="panel settings-section"><div class="settings-body"><h3>Backup e dati</h3><p class="setting-note">Una copia dei tuoi conti, da conservare al sicuro.</p><div class="backup-actions"><button class="btn" data-action="backup">${icon('download')} Esporta JSON</button><button class="btn" data-action="import">${icon('upload')} Importa JSON</button><button class="btn" data-action="download-app">${icon('book')} Scarica HTML</button></div><div class="danger-zone"><button class="btn danger" data-action="reset">${icon('trash')} Cancella tutto</button></div></div></section></div><div><section class="panel settings-section"><div class="settings-body"><h3>Voci di uscita</h3><div class="category-list">${cats().map(n=>`<div class="row">${icon(categoryIcon(n))}<div class="row-info row-name">${esc(n)}</div>${state.customCategories.includes(n)?`<button class="btn quiet icon-only" data-action="delete-category" data-category="${esc(n)}" aria-label="Elimina voce ${esc(n)}" title="Elimina voce">${icon('trash')}</button>`:'<span class="badge">Predefinita</span>'}</div>`).join('')}</div><form id="category-form" class="inline-form"><input name="category" placeholder="Nuova voce personalizzata" aria-label="Nuova voce personalizzata" maxlength="120" required><button class="btn primary icon-only" type="submit" aria-label="Aggiungi voce">${icon('plus')}</button></form></div></section></div></div>${footer()}`}
function render(){const renderers={home,movements,incomes:()=>recurring('income'),expenses:()=>recurring('expense'),stats:statistics,settings};document.getElementById('app').innerHTML=(loadFailure?`<div class="panel settings-body expense" role="status">${esc(loadFailure)}</div>`:'')+renderers[page]();document.getElementById('nav').innerHTML=[['home','home','Home'],['movements','book','Movimenti'],['incomes','income','Entrate'],['expenses','expense','Uscite'],['stats','stats','Statistiche'],['settings','settings','Impostazioni']].map(([p,i,l])=>`<button class="nav-item ${page===p?'active':''}" data-action="go-${p}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('');const a=document.getElementById('income-details'),b=document.getElementById('expense-details');if(a)a.addEventListener('toggle',()=>openIncome=a.open);if(b)b.addEventListener('toggle',()=>openExpense=b.open)}
function rememberDetails(){openIncome=document.getElementById('income-details')?.open??openIncome;openExpense=document.getElementById('expense-details')?.open??openExpense}
function modal(title,body,actions=''){modalData=modalData||{};modalData.previousFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title">${title}</h2><button class="btn quiet icon-only" data-action="close" aria-label="Chiudi">${icon('close')}</button></div>${body}${actions}</section></div>`;setTimeout(()=>document.querySelector('.modal input,.modal select,.modal .btn')?.focus(),30)}
function close(){const prev=modalData?.previousFocus;document.getElementById('modal-root').innerHTML='';modalData=null;confirmCallback=null;if(prev?.isConnected)prev.focus()}
function confirmBox(title,text,cb,label='Conferma',danger=true){confirmCallback=cb;modalData={kind:'confirm'};modal(title,`<p>${text}</p>`,`<div class="modal-actions"><button class="btn" data-action="close">Annulla</button><button class="btn ${danger?'danger':'primary'}" data-action="confirm">${label}</button></div>`)}
function recurringForm(type,editId,category){const inc=type==='income',item=state[inc?'incomes':'expenses'].find(x=>x.id===editId),v=item||{category:category||(inc?'Stipendio':'Mutuo'),amount:0,day:inc?state.settings.startDay:1,frequency:1,active:true,note:''};modalData={kind:type,editId};modal(`${item?'Modifica':'Nuova'} ${inc?'entrata':'uscita'} ricorrente`,`<form id="entry-form"><div class="field"><label for="entry-category">${inc?'Nome':'Voce'}</label><select id="entry-category" name="category">${options(inc?['Stipendio','Pensione','Altro']:cats(),v.category)}</select></div><div class="field-grid"><div class="field"><label for="entry-amount">Importo (€)</label><input id="entry-amount" name="amount" inputmode="decimal" placeholder="0,00" value="${item?amountValue(v.amount):''}" required></div><div class="field"><label for="entry-day">${inc?'Giorno del mese':'Giorno di scadenza'}</label><input id="entry-day" name="day" type="number" min="1" max="31" inputmode="numeric" value="${v.day}" required></div></div>${inc?`<div class="field"><label for="entry-note">Nota <span class="muted">· facoltativa</span></label><input id="entry-note" name="note" maxlength="500" value="${esc(v.note)}" placeholder="Una nota per ricordare"></div>`:`<div class="field"><label for="entry-frequency">Frequenza</label><select id="entry-frequency" name="frequency">${Object.entries(frequencies).map(([k,label])=>`<option value="${k}"${Number(k)===v.frequency?' selected':''}>${label}</option>`).join('')}</select></div><label class="inline-check"><input name="active" type="checkbox"${v.active?' checked':''}> Uscita attiva</label>`}<div class="form-error" id="form-error" role="status"></div><div class="modal-actions"><button class="btn" type="button" data-action="close">Annulla</button><button class="btn primary" type="submit">${icon('check')} ${item?'Salva modifiche':'Aggiungi '+(inc?'entrata':'uscita')}</button></div></form>`)}
function extraForm(type='expense',values={}){modalData={kind:'extra',type};modal('Un movimento in più',`<div class="segment"><button class="btn ${type==='expense'?'selected out':''}" data-action="extra-type" data-type="expense">${icon('expense')} Spesa extra</button><button class="btn ${type==='income'?'selected':''}" data-action="extra-type" data-type="income">${icon('income')} Entrata extra</button></div><form id="entry-form"><div class="field"><label for="entry-category">Categoria</label><select id="entry-category" name="category">${options(type==='income'?['Stipendio','Pensione','Altro']:cats(),values.category||(type==='income'?'Altro':'Spesa alimentare'))}</select></div><div class="field-grid"><div class="field"><label for="entry-amount">Importo (€)</label><input id="entry-amount" name="amount" inputmode="decimal" value="${esc(values.amount||'')}" placeholder="0,00" required></div><div class="field"><label for="entry-date">Data</label><input id="entry-date" name="date" type="date" value="${esc(values.date||C.dateStr(new Date()))}" min="1900-01-01" max="2100-12-31" required></div></div><div class="field"><label for="entry-note">Nota <span class="muted">· facoltativa</span></label><input id="entry-note" name="note" maxlength="500" value="${esc(values.note||'')}" placeholder="Una nota per ricordare"></div>${type==='expense'?'<label class="inline-check"><input name="paid" type="checkbox" checked> Già pagata</label>':''}<div class="form-error" id="form-error" role="status"></div><div class="modal-actions"><button class="btn" type="button" data-action="close">Annulla</button><button class="btn primary" type="submit">${icon('plus')} Aggiungi movimento</button></div></form>`)}
function realForm(rowId){const r=C.rows(state,selected).find(x=>x.id===rowId);if(!r)return;modalData={kind:'real',rowId};modal(esc(r.category),`<p>${fmtDate(r.date)} · ${esc(namePeriod(selected))} ${selected.slice(0,4)}</p><form id="entry-form"><div class="field"><label for="real-amount">Importo reale di questo periodo (€)</label><input name="amount" id="real-amount" inputmode="decimal" value="${amountValue(r.amount)}" required><small>Importo base: ${money(r.base)}</small></div><div class="form-error" id="form-error" role="status"></div><div class="modal-actions"><button class="btn" type="button" data-action="restore" data-id="${esc(r.id)}">${icon('refresh')} Ripristina base</button><button class="btn primary" type="submit">${icon('check')} Salva</button></div>${!r.fixed?`<div class="danger-zone"><button class="btn danger" type="button" data-action="delete-extra" data-id="${esc(r.sourceId)}">${icon('trash')} Elimina movimento</button></div>`:''}</form>`)}
function saveEntry(form){const f=new FormData(form),v=Object.fromEntries(f),amount=parseAmount(v.amount);if(!Number.isFinite(amount)){document.getElementById('form-error').textContent='Inserisci un importo valido, per esempio 1.234,56.';return}if(loadFailure){document.getElementById('form-error').textContent='Ripristina prima un backup valido dalle Impostazioni.';return}const kind=modalData.kind;if(kind==='real'){const row=C.rows(state,selected).find(r=>r.id===modalData.rowId);if(row&&amount===row.base)delete state.overrides[row.id];else state.overrides[modalData.rowId]=amount}else if(kind==='extra'){const item={id:id(),type:modalData.type,category:v.category,amount,date:v.date,note:v.note||''};if(C.dateStr(C.localDate(item.date))!==item.date){document.getElementById('form-error').textContent='La data non è valida.';return}const key=C.periodKey(C.localDate(item.date),state.settings.startDay);if(key<state.settings.firstPeriod){document.getElementById('form-error').textContent='La data precede il primo periodo. Modifica il primo periodo nelle Impostazioni.';return}state.extras.push(item);if(item.type==='expense'&&f.has('paid'))state.checks['extra:'+item.id]=true;selected=key}else{const inc=kind==='income',list=state[inc?'incomes':'expenses'],day=Number(v.day);if(!Number.isInteger(day)||day<1||day>31){document.getElementById('form-error').textContent='Il giorno deve essere compreso tra 1 e 31.';return}const old=list.find(e=>e.id===modalData.editId),item={id:old?.id||id(),category:v.category,amount,day,...(inc?{note:v.note||''}:{frequency:Number(v.frequency),active:f.has('active'),anchor:old?.anchor||C.periodKey(new Date(),state.settings.startDay)})};if(old)list[list.indexOf(old)]=item;else list.push(item)}persist();close();render();notify('Il quaderno è aggiornato.')}
function removeFixed(type,entryId){const inc=type==='income',list=state[inc?'incomes':'expenses'],e=list.find(x=>x.id===entryId);if(!e)return;confirmBox('Eliminare '+esc(e.category)+'?',`Questa ${inc?'entrata':'uscita'} verrà eliminata da <strong>tutti i periodi</strong>, inclusi quelli passati, con i suoi importi reali e le spunte.${inc?'':' Per mantenere lo storico, puoi invece sospenderla nel modulo di modifica.'}`,()=>{state[inc?'incomes':'expenses']=list.filter(x=>x.id!==entryId);const prefix=type+':'+entryId+':';for(const map of [state.checks,state.overrides])Object.keys(map).filter(k=>k.startsWith(prefix)).forEach(k=>delete map[k]);persist();render();notify('Voce eliminata da tutti i periodi.')},'Elimina')}
function blobDownload(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function deliver(blob,filename){const file=new File([blob],filename,{type:blob.type});if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:filename});return}catch(e){if(e.name==='AbortError')return}}blobDownload(blob,filename)}
